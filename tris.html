<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="it">
<head>

    <header>
        <nav>
            <ul>
                <li><a href="main.html">Home</a></li>
                <li><a href="tris.html">Tris</a></li>
                <li><a href="imgs_polli.html">Immagini Polli</a></li>
            </ul>
        </nav>
    </header>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gioco del Tris</title>
    <style>
        #tic-tac-toe {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        .row {
            display: flex;
        }

        .cell {
            width: 100px;
            height: 100px;
            font-size: 24px;
            text-align: center;
            vertical-align: middle;
            border: 1px solid #000;
            background-color: #f9f9f9;
            cursor: pointer;
        }

        .cell:hover {
            background-color: #ddd;
        }

        #reset-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Gioco del Tris</h1>
    <div id="tic-tac-toe">
        <div class="row">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>
        <div class="row">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>
        <div class="row">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>
        <button id="reset-button">Reset</button>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const resetButton = document.getElementById('reset-button');
        let currentPlayer = 'X';

        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                if (cell.textContent === '') {
                    cell.textContent = currentPlayer;
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                }
            });
        });

        resetButton.addEventListener('click', () => {
            cells.forEach(cell => {
                cell.textContent = '';
            });
            currentPlayer = 'X';
        });
    </script>
</body>
</html>


<style>
    nav ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #333;

    nav ul li {

    }

    nav ul li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }

    nav ul li a:hover {
        background-color: #111;
    }
</style>
